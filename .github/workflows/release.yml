name: Release
on:
  push:
    tags:
      - 'v*'
      # Daemon builds are tagged v<version>-android and have their own
      # workflow. Without this exclusion this job also ran for them and tried
      # to publish a module whose version is not a module version at all.
      - '!v*-android'
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: 'Version bump type'
        options:
          - none
          - major
          - minor
          - patch
        default: 'none'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: ./.github/tools/version-bump.sh ${{ inputs.bump }}

      # A tag must describe the commit it points at. Rewriting module.prop on a
      # tag checkout and pushing it to main leaves the tag pointing at a commit
      # whose module.prop still says the old version, which is exactly the
      # "manager offers the wrong update" bug. Refuse instead.
      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          CURRENT_VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          if [[ "$TAG_VERSION" != "$CURRENT_VERSION" ]]; then
            echo "::error::Tag $TAG_VERSION does not match module.prop $CURRENT_VERSION. Bump the version and tag the bumped commit."
            exit 1
          fi

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # vMAJOR.MINOR.PATCH is a stable module release. A fourth component
          # (v1.0.34.1) is a build release and is marked prerelease.
          BUILD=$(echo "$VERSION" | cut -d'.' -f4)
          if [ -n "$BUILD" ] && [ "$BUILD" != "0" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The companion app is built from source by the release job -- aapt2,
      # javac, d8 and apksigner directly, no Gradle. Without this the packaged
      # zip would ship the app's source but no APK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      # The app's signing key, if the repository has one stored as a secret.
      #
      # Without it every build signs the app with a fresh key, and Android
      # then refuses to replace the installed app with the new one -- so a
      # module flash updates the daemon and leaves the app behind. The key
      # is a secret rather than a committed file, so the repository stays
      # free of it.
      - name: Set up the signing key
        env:
          TAILBRIDGE_KEYSTORE_B64: ${{ secrets.TAILBRIDGE_KEYSTORE_B64 }}
        run: |
          if [ -n "$TAILBRIDGE_KEYSTORE_B64" ]; then
            mkdir -p /tmp/ks
            printf '%s' "$TAILBRIDGE_KEYSTORE_B64" | base64 -d > /tmp/ks/tailbridge.jks
            chmod 0600 /tmp/ks/tailbridge.jks
            echo "TAILBRIDGE_KEYSTORE=/tmp/ks/tailbridge.jks" >> "$GITHUB_ENV"
            echo "using the stored signing key"
          else
            echo "no stored signing key; this build signs with a new one"
          fi

      - name: Build
        run: ./.github/tools/build.sh

      # The feed is written before the release, from the files we actually
      # built, so it never points at an asset that was skipped. It also no
      # longer depends on `steps.release.outputs.assets`, which was empty on
      # some runs and produced a null zipUrl.
      - name: Update the update feed
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          VCODE=$(grep '^versionCode=' module.prop | cut -d'=' -f2)
          REPO="${GITHUB_REPOSITORY,,}"
          ZIP="Tailscaled-Reborn-${VERSION}.zip"
          # Prefer the -full zip: the slim one downloads the daemon during
          # install and fails on devices whose installer has no HTTPS-capable
          # wget, which is most modern Android.
          if [ -f "dist/Tailscaled-Reborn-${VERSION}-full.zip" ]; then
            ZIP="Tailscaled-Reborn-${VERSION}-full.zip"
          fi
          ZIP_URL="https://github.com/${REPO}/releases/download/${VERSION}/${ZIP}"
          CHANGELOG="https://raw.githubusercontent.com/${REPO}/main/CHANGELOG.md"
          jq --arg url "$ZIP_URL" --arg v "$VERSION" --arg c "$VCODE" --arg ch "$CHANGELOG" \
             '.version = $v | .versionCode = $c | .zipUrl = $url | .changelog = $ch' \
             update.json > update.json.tmp && mv update.json.tmp update.json
          echo "update.json now:"
          cat update.json

      # Push the feed (and any version bump) BEFORE creating the release. The
      # release tag is then created on this commit rather than the one before
      # it. On a tag push the checkout is detached, so push explicitly to main.
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.prop update.json CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release ${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Tailscaled Reborn ${{ steps.version.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          append_body: true
          body: |
            ## Downloads
            - **Tailscaled-Reborn-${{ steps.version.outputs.version }}.zip** - Lightweight (downloads binaries on install)
            - **Tailscaled-Reborn-${{ steps.version.outputs.version }}-full.zip** - Complete package (includes all binaries)

            ## Download Stats
            ![GitHub Downloads](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.version.outputs.version }}/Tailscaled-Reborn-${{ steps.version.outputs.version }}.zip?style=flat&logo=docusign&logoColor=green&label=Lightweight)
            ![GitHub Downloads](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.version.outputs.version }}/Tailscaled-Reborn-${{ steps.version.outputs.version }}-full.zip?style=flat&logo=docusign&logoColor=green&label=Full%20Package)
