name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: 'Version bump type'
        options:
          - none
          - major
          - minor
          - patch
          - build
        default: 'none'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: ./.github/tools/version-bump.sh ${{ inputs.bump }}

      - name: Sync version from tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          CURRENT_VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          if [[ "$TAG_VERSION" != "$CURRENT_VERSION" ]]; then
            echo "Tag $TAG_VERSION doesn't match module.prop $CURRENT_VERSION, updating..."
            VERSION_NUM=${TAG_VERSION#v}
            IFS='.' read -r MAJOR MINOR PATCH BUILD <<< "$VERSION_NUM"
            VERSION_CODE=$(printf "%02d%02d%02d%02d" "$MAJOR" "$MINOR" "$PATCH" "$BUILD")
            sed -i "s/^version=.*/version=$TAG_VERSION/" module.prop
            sed -i "s/^versionCode=.*/versionCode=$VERSION_CODE/" module.prop
          fi

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Check if it's a build release. Version is vMAJOR.MINOR.PATCH, with an
          # optional fourth .BUILD component; an absent component is 0, not a
          # prerelease. Reading f4 of a 3-part version returns "" and used to
          # mark every release a prerelease.
          BUILD=$(echo "$VERSION" | cut -d'.' -f4)
          [ -z "$BUILD" ] && BUILD=0
          if [ "$BUILD" != "0" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The companion app is built from source by the release job -- aapt2,
      # javac, d8 and apksigner directly, no Gradle. Without this the packaged
      # zip would ship the app's source but no APK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      # The app's signing key, if the repository has one stored as a secret.
      #
      # Without it every build signs the app with a fresh key, and Android
      # then refuses to replace the installed app with the new one -- so a
      # module flash updates the daemon and leaves the app behind. The key
      # is a secret rather than a committed file, so the repository stays
      # free of it.
      - name: Set up the signing key
        env:
          TAILBRIDGE_KEYSTORE_B64: ${{ secrets.TAILBRIDGE_KEYSTORE_B64 }}
        run: |
          if [ -n "$TAILBRIDGE_KEYSTORE_B64" ]; then
            mkdir -p /tmp/ks
            printf '%s' "$TAILBRIDGE_KEYSTORE_B64" | base64 -d > /tmp/ks/tailbridge.jks
            chmod 0600 /tmp/ks/tailbridge.jks
            echo "TAILBRIDGE_KEYSTORE=/tmp/ks/tailbridge.jks" >> "$GITHUB_ENV"
            echo "using the stored signing key"
          else
            echo "no stored signing key; this build signs with a new one"
          fi

      - name: Build
        run: ./.github/tools/build.sh

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Tailscaled Reborn ${{ steps.version.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          append_body: true
          body: |
            ## Downloads
            - **Tailscaled-Reborn-${{ steps.version.outputs.version }}.zip** - Lightweight (downloads binaries on install)
            - **Tailscaled-Reborn-${{ steps.version.outputs.version }}-full.zip** - Complete package (includes all binaries)
            
            ## Download Stats
            ![GitHub Downloads](https://img.shields.io/github/downloads/paras-moharle/tailscaled-reborn/${{ steps.version.outputs.version }}/Tailscaled-Reborn-${{ steps.version.outputs.version }}.zip?style=flat&logo=docusign&logoColor=green&label=Lightweight)
            ![GitHub Downloads](https://img.shields.io/github/downloads/paras-moharle/tailscaled-reborn/${{ steps.version.outputs.version }}/Tailscaled-Reborn-${{ steps.version.outputs.version }}-full.zip?style=flat&logo=docusign&logoColor=green&label=Full%20Package)

      - name: Update the update feed
        env:
          ASSETS: ${{ steps.release.outputs.assets }}
        run: |
          # Must set version AND versionCode, not just the URL. A feed that
          # keeps an older versionCode is worse than no feed at all: every
          # manager then offers "update" and would install a stale build.
          #
          # Prefer the -full zip: the slim one downloads the daemon during
          # install and fails on devices whose installer has no HTTPS-capable
          # wget, which is most modern Android.
          ZIP_URL=$(echo "$ASSETS" | jq -r '
            [ .[] | select(.name | endswith(".zip")) ] as $z
            | (($z[] | select(.name | contains("-full"))) // $z[0]) | .browser_download_url')
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          VCODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          CHANGELOG="https://raw.githubusercontent.com/${GITHUB_REPOSITORY,,}/main/CHANGELOG.md"
          jq --arg url "$ZIP_URL" --arg v "$VERSION" --arg c "$VCODE" --arg ch "$CHANGELOG" \
             '.version = $v | .versionCode = $c | .zipUrl = $url | .changelog = $ch' \
             update.json > update.json.tmp && mv update.json.tmp update.json
          echo "update.json now:"
          cat update.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.prop update*.json CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Bump version to ${{ steps.version.outputs.version }}"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              git push
            fi
          fi
