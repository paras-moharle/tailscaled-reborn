name: Build Android binaries

# Build a tailscaled for Android from a given upstream Tailscale release,
# applying the Android port in builder/, and publish it as a GitHub release.
#
# Release layout must match what two consumers expect:
#   * clientupdate/clientupdate_android.go (so `tailscale update` works on device)
#     looks for tag `v<version>-android` and assets named
#     `tailscale_<version>_<arch>.tgz`
#   * customize.sh downloads `tailscale_.*_<arch>.tgz` from the latest release

on:
  push:
    tags:
      - 'v*-android'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream Tailscale tag to build (e.g. v1.104.1)'
        required: true
      publish:
        description: 'Publish a release the phone updater can find'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'builder/go.mod'
          check-latest: true

      - name: Determine upstream tag
        id: src
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            # v1.104.1-android -> v1.104.1
            TAG="${GITHUB_REF_NAME%-android}"
            TAG="v${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The release must be tagged v<version>-android. On a tag push that is
          # github.ref_name, but on workflow_dispatch ref_name is the BRANCH, so
          # using it directly published a release named "main".
          echo "release=$TAG-android" >> "$GITHUB_OUTPUT"
          echo "Building upstream $TAG"

      # Fails loudly, on purpose, if upstream refactored something the Android
      # port depends on. See the comment block in builder/port-android.sh.
      - name: Build binaries
        env:
          TS_UPDATE_REPO: ${{ github.repository }}
        run: ./builder/build-binaries.sh "${{ steps.src.outputs.tag }}"

      # NOTE: deliberately no module packaging here. Building the module zip
      # here meant downloading binaries from the very feed this run is about to
      # publish. Module zips are release.yml's job.

      - name: Create release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish == false) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.src.outputs.release }}
          name: tailscaled ${{ steps.src.outputs.tag }} (Android)
          prerelease: ${{ contains(steps.src.outputs.tag, '-') }}
          # This is the release /releases/latest should resolve to: the
          # in-binary updater and the packaging fallback both read it looking
          # for a daemon archive. Module releases pass make_latest: false
          # (release.yml) so they cannot take the pointer away.
          make_latest: true
          generate_release_notes: true
          body: |
            Android build of Tailscale, built from upstream `${{ steps.src.outputs.tag }}`
            with the Android port applied by `builder/port-android.sh`.

            Installed by Magisk-Tailscaled on first install, and by
            `tailscale update` / `tailscaled.update run` afterwards.

            **Verify before flashing:**
            ```
            sha256sum -c SHA256SUMS
            ```
          files: |
            dist/tailscale_*.tgz
            dist/SHA256SUMS
            dist/latest.json

      # The phone must have ONE stable URL to poll. /releases/latest/ cannot be
      # used here: this repo also publishes module releases, so
      # "latest" flips between a module zip and a daemon binary and the feed
      # breaks half the time. A file on main has no such ambiguity.
      - name: Publish the feed pointer
        run: |
          set -euo pipefail
          # Stamp the publication time so phones can hold a brand-new build back
          # for TS_UPDATE_SETTLE_HOURS. Stored as an epoch integer, not ISO-8601:
          # Android's toybox date cannot parse a formatted timestamp.
          #
          # `repo` says which repository the release tag belongs to. Without it a
          # consumer has to assume, and the assumption breaks the moment the
          # daemon build and the module zip share a repo: /releases/latest is
          # then whichever was published last, not whichever holds the daemon.
          jq --argjson ts "$(date +%s)" \
             --arg repo "${GITHUB_REPOSITORY}" \
             '.publishedAtEpoch = $ts | .repo = $repo' \
             dist/latest.json > tailscale-latest.json
          if git diff --quiet -- tailscale-latest.json; then
            echo "feed already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tailscale-latest.json
            git commit -m "tailscaled ${{ steps.src.outputs.tag }} is the current Android build"
            # A tag push checks out a detached HEAD, where a bare `git push`
            # fails: it has no upstream branch. Say where it goes.
            git push origin HEAD:main
          fi

      # A failed build means every phone stays on the old version forever with
      # no indication that anything is wrong. File it where it will be seen.
      - name: Report the failure
        if: failure()
        run: |
          set -uo pipefail
          TAG="${{ steps.src.outputs.tag }}"
          [ -n "$TAG" ] || TAG="unknown"
          TITLE="Android port does not build against Tailscale ${TAG}"
          LABEL="port-failure"

          # One open issue per version: the daily watcher would otherwise open a
          # new one every 24h for as long as the break lasts.
          EXISTING=$(gh issue list --label "$LABEL" --state open \
            --search "\"$TAG\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)

          BODY=$(cat <<EOF
          The Android port failed to build against upstream Tailscale \`${TAG}\`.

          Every phone stays on its current \`tailscaled\` until this is fixed --
          there is no fallback build, because \`port-android.sh\` fails rather
          than emitting a binary that installs and then misbehaves.

          **Usual cause:** upstream moved or refactored something the port
          patches. \`builder/port-android.sh\` reports the exact file and the
          text it expected.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY" || true
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY" || true
          fi
